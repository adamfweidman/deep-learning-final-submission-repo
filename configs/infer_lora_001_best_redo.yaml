  img_size: 224
  batch_size: 48
  adapter_path: "/scratch/${USER}/deep-learning-final/runs/2026-05-05-lora-001/adapter_best"

train:
  eval_num_workers: 4

preflight:
  hf_cache_dir: "/scratch/${USER}/deep-learning-final/hf_cache"
