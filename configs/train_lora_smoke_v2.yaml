# Smoke for the v2 training surface: DataLoader workers + per-epoch
# checkpointing + adapter_latest + resume. Verifies that
# 1) workers fork cleanly with the model+processor in main,
# 2) checkpoint.pt + adapter_latest are written each epoch,
# 3) GPU is no longer 0% during eval (the 8055893 kill cause).

attempt_id: "2026-05-06-lora-smoke-002"
level: "exploratory"

experiment:
  name: "lora-smoke-v2"
  question: "Does the workers + checkpointing path run end-to-end without GPU starvation?"
  branch: "infra-fix"

model:
  name: "HuggingFaceTB/SmolVLM-500M-Instruct"
  dtype: "bfloat16"
  max_tokens: 8192

data:
  data_dir: "data"
  train_csv: "data/train.csv"
  val_csv: "data/val.csv"
  test_csv: "data/test.csv"
  sample_submission_csv: "data/sample_submission.csv"

run:
  mode: "train"
  output_dir: "/scratch/${USER}/deep-learning-final/runs/2026-05-06-lora-smoke-002"
  seed: 42
  baseline: "always_a"
  img_size: 224

train:
  n_train: 200
  n_val_eval: 64
  n_test: 0
  epochs: 2          # 2 epochs so we exercise the resume / checkpoint flow once
  batch_size: 4
  grad_accum: 2
  lr: 2.0e-4
  warmup_ratio: 0.05
  weight_decay: 0.0
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  eval_batch_size: 48
  eval_num_workers: 4
  train_num_workers: 4
  train_prefetch_factor: 2
  log_every: 5
  eval_every_epoch: true
  early_stop_patience: 2
  write_submission_csv: false

preflight:
  hf_cache_dir: "/scratch/${USER}/deep-learning-final/hf_cache"
  download_first: false
  snapshot_only: false
  offline_after: true

resources: {}
notes: "Validates v2 code path (workers + checkpointing) before bundling 3 full runs."
