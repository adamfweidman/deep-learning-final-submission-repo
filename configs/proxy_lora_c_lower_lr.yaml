# Proxy run for V_C (r=8/all / lr=5e-5 / 10% warmup).
# 500 train rows × 2 epochs, n_val_eval=200, no test submission.

attempt_id: "2026-05-06-proxy-lora-c-lr5e5"
level: "exploratory"

experiment:
  name: "proxy-C-lr5e5"
  question: "Does lr=5e-5 + 10% warmup beat lr=2e-4 at proxy scale? (finer LR diagnose)"
  branch: "diagnose"

model:
  name: "HuggingFaceTB/SmolVLM-500M-Instruct"
  dtype: "bfloat16"
  max_tokens: 8192

data:
  data_dir: "data"
  train_csv: "data/train.csv"
  val_csv: "data/val.csv"
  test_csv: "data/test.csv"
  sample_submission_csv: "data/sample_submission.csv"

run:
  mode: "train"
  output_dir: "/scratch/${USER}/deep-learning-final/runs/2026-05-06-proxy-lora-c-lr5e5"
  seed: 44
  baseline: "always_a"
  img_size: 224

train:
  n_train: 500
  n_val_eval: 200
  n_test: 0
  epochs: 2
  batch_size: 4
  grad_accum: 2
  lr: 5.0e-5
  warmup_ratio: 0.10
  weight_decay: 0.0
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  eval_batch_size: 48
  eval_num_workers: 4
  train_num_workers: 4
  log_every: 10
  eval_every_epoch: true
  early_stop_patience: 2
  write_submission_csv: false

preflight:
  hf_cache_dir: "/scratch/${USER}/deep-learning-final/hf_cache"
  download_first: false
  snapshot_only: false
  offline_after: true

resources: {}

notes: "Proxy variant C — finer LR diagnose."
