attempt_id: "2026-05-06-explore-e9-wd05"
level: "exploratory"

experiment:
  name: "explore-e9-wd05"
  question: "Does weight_decay=0.05 mitigate the over-fitting drift observed at epoch 3+ in 8055893?"
  branch: "diagnose"

model:
  name: "HuggingFaceTB/SmolVLM-500M-Instruct"
  dtype: "bfloat16"
  max_tokens: 8192

data:
  data_dir: "data"
  train_csv: "data/train.csv"
  val_csv: "data/val.csv"
  test_csv: "data/test.csv"
  sample_submission_csv: "data/sample_submission.csv"

run:
  mode: "train"
  output_dir: "/scratch/${USER}/deep-learning-final/runs/2026-05-06-explore-e9-wd05"
  seed: 42
  baseline: "always_a"
  img_size: 224

train:
  n_train: 1000
  n_val_eval: 400
  n_test: 0
  epochs: 2
  batch_size: 4
  grad_accum: 2
  lr: 0.0002
  warmup_ratio: 0.05
  weight_decay: 0.05
  lora_r: 8
  lora_alpha: 8
  lora_dropout: 0.05
  # default target_modules: q/k/v/o + gate/up/down (text + vision attention via PEFT pattern match)
  choice_permute: true
  include_lecture: true
  include_hint: true
  eval_batch_size: 48
  eval_num_workers: 4
  train_num_workers: 4
  log_every: 25
  eval_every_epoch: true
  early_stop_patience: 2
  write_submission_csv: false

preflight:
  hf_cache_dir: "/scratch/${USER}/deep-learning-final/hf_cache"
  download_first: false
  snapshot_only: false
  offline_after: true

resources: {}

notes: |
  LoRA usually doesn't need WD, but on small data + small adapter it sometimes helps.
