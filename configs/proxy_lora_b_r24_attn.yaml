# Proxy run for V_B (r=24 attention-only / lr=2e-4).
# 500 train rows × 2 epochs, n_val_eval=200, no test submission.

attempt_id: "2026-05-06-proxy-lora-b-r24attn"
level: "exploratory"

experiment:
  name: "proxy-B-r24attn"
  question: "Does r=24 attention-only beat r=8/all at proxy scale? (capacity bet)"
  branch: "broaden"

model:
  name: "HuggingFaceTB/SmolVLM-500M-Instruct"
  dtype: "bfloat16"
  max_tokens: 8192

data:
  data_dir: "data"
  train_csv: "data/train.csv"
  val_csv: "data/val.csv"
  test_csv: "data/test.csv"
  sample_submission_csv: "data/sample_submission.csv"

run:
  mode: "train"
  output_dir: "/scratch/${USER}/deep-learning-final/runs/2026-05-06-proxy-lora-b-r24attn"
  seed: 43
  baseline: "always_a"
  img_size: 224

train:
  n_train: 500
  n_val_eval: 200
  n_test: 0
  epochs: 2
  batch_size: 4
  grad_accum: 2
  lr: 2.0e-4
  warmup_ratio: 0.05
  weight_decay: 0.0
  lora_r: 24
  lora_alpha: 48
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  eval_batch_size: 48
  eval_num_workers: 4
  train_num_workers: 4
  log_every: 10
  eval_every_epoch: true
  early_stop_patience: 2
  write_submission_csv: false

preflight:
  hf_cache_dir: "/scratch/${USER}/deep-learning-final/hf_cache"
  download_first: false
  snapshot_only: false
  offline_after: true

resources: {}

notes: "Proxy variant B — capacity bet at 4.92M trainable, attention-only."
