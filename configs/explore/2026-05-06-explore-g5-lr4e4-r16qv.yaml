attempt_id: "2026-05-06-explore-g5-lr4e4-r16qv"
level: "exploratory"
experiment:
  name: "g5-lr4e4-r16qv"
  question: "Does r=16 q+v text-only at lr=4e-4 outperform r=8/all at lr=4e-4?"
  branch: "exploit"
model:
  name: "HuggingFaceTB/SmolVLM-500M-Instruct"
  dtype: "bfloat16"
  max_tokens: 8192
data:
  data_dir: "data"
  train_csv: "data/train.csv"
  val_csv: "data/val.csv"
  test_csv: "data/test.csv"
  sample_submission_csv: "data/sample_submission.csv"
run:
  mode: "train"
  output_dir: "/scratch/${USER}/deep-learning-final/runs/2026-05-06-explore-g5-lr4e4-r16qv"
  seed: 48
  baseline: "always_a"
  img_size: 224
train:
  n_train: 1000
  n_val_eval: 400
  n_test: 0
  epochs: 2
  batch_size: 4
  grad_accum: 2
  lr: 0.0004
  warmup_ratio: 0.05
  weight_decay: 0.0
  lora_r: 16
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules_regex: "^.*text_model\\.layers\\.\\d+\\.self_attn\\.(q_proj|v_proj)$"
  choice_permute: true
  include_lecture: true
  include_hint: true
  eval_batch_size: 48
  eval_num_workers: 4
  train_num_workers: 4
  log_every: 25
  eval_every_epoch: true
  early_stop_patience: 2
  write_submission_csv: false
preflight:
  hf_cache_dir: "/scratch/${USER}/deep-learning-final/hf_cache"
  download_first: false
  snapshot_only: false
  offline_after: true
resources: {}
notes: "Text-only scoped LoRA (avoids vision-tower bloat); alpha/r=1.0; ~1.64M trainable"
