attempt_id: "2026-05-06-explore-i2-solution-proxy"
level: "exploratory"
experiment:
  name: "i2-solution-proxy"
  question: "At proxy scale (1000 train × 2 ep × n_val=400) does solution-as-input training beat the no-solution baseline E8 (val=0.7075) by the +2-5pp paper-scout grounded?"
  branch: "broaden"
model: {name: "HuggingFaceTB/SmolVLM-500M-Instruct", dtype: "bfloat16", max_tokens: 8192}
data: {data_dir: "data", train_csv: "data/train.csv", val_csv: "data/val.csv", test_csv: "data/test.csv", sample_submission_csv: "data/sample_submission.csv"}
run:
  mode: "train"
  output_dir: "/scratch/${USER}/deep-learning-final/runs/2026-05-06-explore-i2-solution-proxy"
  seed: 42
  baseline: "always_a"
  img_size: 224
train:
  n_train: 1000
  n_val_eval: 400
  n_test: 0
  epochs: 2
  batch_size: 4
  grad_accum: 2
  lr: 4.0e-4
  warmup_ratio: 0.05
  weight_decay: 0.0
  lora_r: 8
  lora_alpha: 8
  lora_dropout: 0.05
  choice_permute: true
  include_solution_train: true
  eval_batch_size: 32
  eval_num_workers: 4
  train_num_workers: 4
  log_every: 25
  eval_every_epoch: true
  early_stop_patience: 2
  write_submission_csv: false
preflight: {hf_cache_dir: "/scratch/${USER}/deep-learning-final/hf_cache", download_first: false, snapshot_only: false, offline_after: true}
resources: {}
notes: "Compares to E8 (lr=4e-4, no solution) = 0.7075 at proxy scale. If solution-as-input lifts > 0.73, worth promoting."
